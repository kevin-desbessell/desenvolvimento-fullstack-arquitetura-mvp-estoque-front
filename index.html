<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app">
        <!-- Cabeçalho principal da aplicação -->
        <header class="hero">
            <div class="hero-content">
                <p class="eyebrow">MVP • Controle de Estoque</p>
                <h1>Loja de Materiais de Construção</h1>
                <p class="hero-text">
                    Sistema simples para cadastrar, listar, editar e remover produtos do estoque.
                </p>
            </div>
        </header>

        <main class="container">
            <!-- Seção do formulário de cadastro e edição -->
            <section class="panel">
                <div class="section-header">
                    <div>
                        <h2 id="form-title">Cadastrar produto</h2>
                        <p class="section-subtitle">
                            Preencha os campos abaixo para adicionar um item ao estoque.
                        </p>
                    </div>
                </div>

                <!-- Formulário principal -->
                <form id="product-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Ex.: Cimento CP II" required />
                        </div>

                        <div class="form-group">
                            <label for="categoria">Categoria</label>
                            <input type="text" id="categoria" placeholder="Ex.: Cimento" required />
                        </div>

                        <div class="form-group">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" id="quantidade" min="0" step="1" placeholder="Ex.: 100" required />
                        </div>

                        <div class="form-group">
                            <label for="unidade">Unidade</label>
                            <input type="text" id="unidade" placeholder="Ex.: saco" required />
                        </div>

                        <div class="form-group">
                            <label for="preco">Preço</label>
                            <input type="number" id="preco" min="0" step="0.01" placeholder="Ex.: 42.90" required />
                        </div>

                        <div class="form-group form-group-full">
                            <label for="descricao">Descrição</label>
                            <textarea id="descricao" rows="3" placeholder="Ex.: Saco de 50kg"></textarea>
                        </div>
                    </div>

                    <!-- Botões de ação do formulário -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            Cadastrar produto
                        </button>
                        <button type="button" class="btn btn-secondary hidden" id="cancel-edit-btn">
                            Cancelar edição
                        </button>
                    </div>
                </form>
            </section>

            <!-- Seção de exibição dos produtos -->
            <section class="panel">
                <div class="toolbar">
                    <div>
                        <h2>Produtos cadastrados</h2>
                        <p class="section-subtitle" id="status-text">
                            Carregando produtos...
                        </p>
                    </div>

                    <!-- Botões para alternar entre cards e lista -->
                    <div class="view-toggle">
                        <button class="btn btn-view active" id="cards-view-btn" type="button">Cards</button>
                        <button class="btn btn-view" id="list-view-btn" type="button">Lista</button>
                    </div>
                </div>

                <!-- Área de feedback de sucesso ou erro -->
                <div id="feedback" class="feedback hidden"></div>

                <!-- Container dinâmico onde os produtos são renderizados -->
                <section id="products-container" class="products-container"></section>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
